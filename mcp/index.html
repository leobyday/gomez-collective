<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP Connectors — Gomez Collective</title>
  <meta name="description" content="Free MCP connectors for Claude built by Gomez Collective. Connect Claude to real tools and live data.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://gomezcollective.com/mcp">
  <link rel="icon" href="/assets/Emoji.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy:ital@0;1&family=Jost:wght@300;400&family=Source+Code+Pro&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-bg:      #ecf1f3;
      --color-surface: #ffffff;
      --color-text:    #3d3838;
      --color-body:    #706b6b;
      --color-olive:   #847e65;
      --color-dim:     #b8b7b7;
      --color-divider: #d9d9d9;
      --font-serif:    'Sorts Mill Goudy', Georgia, serif;
      --font-sans:     'Jost', sans-serif;
      --font-mono:     'Source Code Pro', monospace;
    }

    html, body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);
      font-weight: 300;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Nav ── */
    .site-nav {
      display: flex;
      align-items: center;
      padding: 18px 80px;
      border-bottom: 1px solid var(--color-divider);
      background: var(--color-surface);
    }
    .nav-back {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--color-olive);
      text-decoration: none;
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    .nav-back:hover { opacity: 1; }

    /* ── Page ── */
    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 72px 80px 100px;
    }

    .page-eyebrow {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-olive);
      margin-bottom: 16px;
    }
    .page-title {
      font-family: var(--font-serif);
      font-size: clamp(28px, 4vw, 44px);
      font-weight: 400;
      color: var(--color-text);
      margin-bottom: 12px;
      line-height: 1.15;
    }
    .page-title em { font-style: italic; color: var(--color-olive); }
    .page-desc {
      font-size: 18px;
      font-weight: 300;
      color: var(--color-body);
      margin-bottom: 64px;
      max-width: 540px;
      line-height: 1.65;
    }

    /* ── Card grid ── */
    .mcp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    .mcp-card {
      background: var(--color-surface);
      border: 1px solid var(--color-divider);
      border-radius: 10px;
      padding: 28px 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s;
    }
    .mcp-card:hover { border-color: var(--color-olive); }

    .mcp-card-name {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 400;
      color: var(--color-text);
    }
    .mcp-card-desc {
      font-size: 15px;
      font-weight: 300;
      color: var(--color-body);
      line-height: 1.65;
      flex: 1;
    }
    .mcp-card-url {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--color-dim);
      letter-spacing: 0.03em;
      padding: 8px 0;
      border-top: 1px solid var(--color-divider);
      margin-top: 4px;
    }
    .mcp-card-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .mcp-card-link {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-olive);
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .mcp-card-link:hover { opacity: 1; }

    /* ── Footer ── */
    .site-footer {
      padding: 36px 80px;
      border-top: 1px solid var(--color-divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .footer-link {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--color-olive);
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .footer-link:hover { opacity: 1; }
    .footer-credit {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--color-dim);
    }

    @media (max-width: 768px) {
      .site-nav, .page, .site-footer { padding-left: 20px; padding-right: 20px; }
      .page { padding-top: 48px; }
    }
  </style>
</head>
<body>

  <nav class="site-nav">
    <a href="/" class="nav-back">← Portfolio</a>
  </nav>

  <main class="page">
    <p class="page-eyebrow">MCP Connectors</p>
    <h1 class="page-title">Tools for <em>Claude</em></h1>
    <p class="page-desc">Free MCP connectors that give Claude access to real data. Connect once, use everywhere.</p>

    <div class="mcp-grid">

      <!-- Connectors will appear here when ready -->

    </div>
  </main>

  <footer class="site-footer">
    <a href="/" class="footer-link">← gomezcollective.com</a>
    <p class="footer-credit">Built by Gomez Collective</p>
  </footer>

  <script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
