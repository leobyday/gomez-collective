<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leo Gomez &#8212; Product Designer · Design Engineer</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:      #455066;
      --accent-deep: #2f3a4d;
      --ink:         #3a4356;
      --ink-soft:    #5b6577;
      --faint:       #6b7386;
      --line:        rgba(58,67,86,0.13);
      --glass-bg:    rgba(255,255,255,0.42);
      --glass-bdr:   rgba(255,255,255,0.62);

      --font-display: 'Jura', 'Trebuchet MS', sans-serif;
      --font-mono:    'JetBrains Mono', 'Cascadia Code', monospace;
      --fs:  13px;
      --lh:  1.75;
    }

    html, body { height: 100%; }

    body {
      font-family: var(--font-mono);
      font-size: var(--fs);
      line-height: var(--lh);
      color: var(--ink);
      background: #b8ccd8 url('assets/08_SSH/BG.gif') center/cover no-repeat fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 28px 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── macOS outer Terminal window ────────────────────── */
    .macos-win {
      width: 820px;
      max-width: 100%;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(22,22,24,0.88);
      border: 1px solid rgba(0,0,0,0.5);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.07),
        0 28px 80px rgba(30,50,80,0.45);
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
    }

    .macos-bar {
      background: linear-gradient(180deg, #3c3c3e 0%, #2c2c2e 100%);
      border-bottom: 1px solid #111;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      user-select: none;
      gap: 10px;
    }

    .mac-dots { display: flex; gap: 8px; flex-shrink: 0; }
    .mac-dot  { width: 12px; height: 12px; border-radius: 50%; }
    .mac-r { background: #ff5f57; }
    .mac-y { background: #ffbd2e; }
    .mac-g { background: #28c840; }

    .macos-label {
      flex: 1;
      text-align: center;
      font-family: var(--font-display);
      font-size: 12px;
      color: #888;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reconnect-btn {
      font-family: var(--font-mono);
      font-size: 11px;
      color: #555;
      cursor: pointer;
      letter-spacing: 0.06em;
      flex-shrink: 0;
      transition: color 0.2s;
    }
    .reconnect-btn:hover { color: #9ab; }

    /* ── Terminal content area (transparent over BG.gif) ── */
    .term-bg {
      position: relative;
      min-height: 500px;
      padding: 20px 18px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: rgba(140,165,190,0.10);
      overflow: hidden;
    }

    #bg-canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Shell context text (outer terminal area) ──────── */
    .shell-ctx {
      align-self: flex-start;
      position: relative;
      z-index: 1;
      font-size: 12px;
      color: rgba(40,55,80,0.5);
      line-height: 1.65;
    }

    .s-line { display: block; }
    .s-pmt  { color: rgba(40,55,80,0.4); }
    .s-cur  {
      display: inline-block;
      width: 7px; height: 13px;
      background: rgba(40,55,80,0.45);
      vertical-align: text-bottom;
      animation: sc-blink 1s step-end infinite;
    }
    @keyframes sc-blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @media (prefers-reduced-motion: reduce) { .s-cur { animation: none; } }

    /* ── Inner SSH window — frosted glass ──────────────── */
    .inner-win {
      position: relative;
      z-index: 2;
      width: 640px;
      max-width: 100%;
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      backdrop-filter: blur(22px) saturate(150%);
      border: 1px solid var(--glass-bdr);
      border-radius: 12px;
      overflow: hidden;
      box-shadow:
        0 20px 60px rgba(40,60,90,0.22),
        inset 0 1px 0 rgba(255,255,255,0.7);
      transition: opacity 0.45s ease;
    }

    .inner-bar {
      background: rgba(255,255,255,0.28);
      border-bottom: 1px solid var(--line);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      user-select: none;
    }

    .inner-dots { display: flex; gap: 7px; }
    .inner-dot  { width: 11px; height: 11px; border-radius: 50%; opacity: 0.85; }
    .in-r { background: #e0928d; }
    .in-y { background: #e5c07a; }
    .in-g { background: #a9c48f; }

    .inner-title {
      margin-left: auto;
      font-family: var(--font-display);
      font-size: 12px;
      color: var(--faint);
      letter-spacing: 0.05em;
    }

    /* ── Interactive terminal content ──────────────────── */
    .term {
      padding: 20px 24px 24px;
      min-height: 300px;
      max-height: 50vh;
      overflow-y: auto;
    }

    .term::-webkit-scrollbar { width: 3px; }
    .term::-webkit-scrollbar-track { background: transparent; }
    .term::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

    .term-footer {
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,0.22);
      padding: 7px 24px;
    }

    .hint {
      font-size: 11px;
      color: var(--faint);
      letter-spacing: 0.04em;
    }

    /* ── Typography helpers ─────────────────────────────── */
    .L  { display: block; white-space: pre-wrap; word-break: break-word; }
    .Lg { display: block; height: calc(var(--fs) * var(--lh)); }

    .dim    { color: var(--faint); }
    .bright { color: var(--ink); font-weight: 600; }
    .accent { color: var(--accent); }
    .soft   { color: var(--ink-soft); }
    .pmt    { color: var(--accent); }

    /* ── Cursor ──────────────────────────────────────────── */
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .cursor {
      display: inline-block;
      color: var(--accent);
      animation: blink 1.1s step-end infinite;
    }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }

    /* ── Menu ───────────────────────────────────────────── */
    .mlist { margin: 4px 0; }

    .mitem {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 10px;
      border-left: 2px solid transparent;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
      border-radius: 0 5px 5px 0;
    }
    .mitem:hover { background: rgba(69,80,102,0.07); }
    .mitem.sel {
      background: rgba(69,80,102,0.10);
      border-left-color: var(--accent);
    }

    .mcaret { color: var(--accent); width: 12px; flex-shrink: 0; font-weight: 700; }
    .mlabel { color: var(--ink); font-size: 15px; }
    .mitem.sel .mlabel { color: var(--accent-deep); font-weight: 600; }

    /* ── Section content ────────────────────────────────── */
    .sect-title {
      font-family: var(--font-display);
      color: var(--ink);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .ac-link {
      color: var(--accent);
      text-decoration: none;
    }
    .ac-link:hover { text-decoration: underline; }

    .back-btn {
      background: none;
      border: none;
      font: inherit;
      cursor: pointer;
      color: var(--accent);
      padding: 0;
      letter-spacing: inherit;
    }
    .back-btn:hover { color: var(--accent-deep); }

    /* ── Mobile ─────────────────────────────────────────── */
    @media (max-width: 680px) {
      body { padding: 0; align-items: flex-end; }
      .macos-win  { width: 100%; border-radius: 0; }
      .inner-win  { width: 100%; border-radius: 0; border-left: 0; border-right: 0; }
      .term       { max-height: 56dvh; min-height: 260px; }
      .term-bg    { padding: 12px 10px 16px; min-height: 420px; }
      :root       { --fs: 12px; }
      .macos-label { font-size: 10px; }
      .mlabel     { font-size: 14px; }
    }
  </style>
</head>

<script>

/* ══════════════════════════════════════════════════════════════════
   LOGIC — no need to edit below
   ══════════════════════════════════════════════════════════════════ */

const term     = document.getElementById('term');
const hintEl   = document.getElementById('hint');
const innerWin = document.getElementById('inner-win');
const postCtx  = document.getElementById('post-ctx');
const sshType  = document.getElementById('ssh-type');
const termBg   = document.getElementById('term-bg');
const SECTS    = DATA.sections;
const noAnim   = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let state    = 'booting';
let menuIdx  = 0;
let skipBoot = false;

// ── Utilities ────────────────────────────────────────────────

const wait = ms => new Promise(r => setTimeout(r, ms));

function L(cls, html) { return `<span class="L ${cls}">${html}</span>`; }
function Lg()         { return '<span class="Lg"></span>'; }
function div(n = 40)  { return L('dim', '─'.repeat(n)); }
function sectHd(t)    { return [Lg(), `<span class="L sect-title">${t}</span>`, div(), Lg()]; }

// ── Canvas character rain (slate-blue, over the sky GIF) ─────

(function initCanvas() {
  const canvas = document.getElementById('bg-canvas');
  const ctx    = canvas.getContext('2d');
  const CHARS  = 'GOMEZCOLLECTIVE0123456789!@#$?/\\|<>abcdefghijklmnopqrstuvwxyz';
  const FS     = 13;
  let cols, drops;

  function resize() {
    const r   = termBg.getBoundingClientRect();
    canvas.width  = r.width;
    canvas.height = r.height;
    cols  = Math.floor(canvas.width / FS);
    drops = Array.from({ length: cols }, () => ({
      y:     Math.random() * -80,
      speed: 0.12 + Math.random() * 0.28,
      trail: Array.from({ length: 14 }, () => CHARS[Math.floor(Math.random() * CHARS.length)]),
      tick:  0,
    }));
  }

  let last = 0;
  function draw(ts) {
    if (!noAnim) requestAnimationFrame(draw);
    const dt = Math.min(ts - last, 50);
    last = ts;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.font = `${FS}px 'JetBrains Mono', monospace`;

    drops.forEach((d, i) => {
      d.y    += d.speed * (dt / 16);
      d.tick += dt;
      if (d.y * FS > canvas.height + 60) {
        d.y    = -Math.random() * 40;
        d.speed = 0.12 + Math.random() * 0.28;
      }
      if (d.tick > 130 + Math.random() * 200) {
        d.trail[Math.floor(Math.random() * d.trail.length)] = CHARS[Math.floor(Math.random() * CHARS.length)];
        d.tick = 0;
      }
      for (let j = 0; j < d.trail.length; j++) {
        const cy = (d.y - j) * FS;
        if (cy < -FS || cy > canvas.height) continue;
        const alpha = Math.max(0, (d.trail.length - j) / d.trail.length) * 0.07;
        ctx.fillStyle = `rgba(58,67,100,${alpha.toFixed(3)})`;
        ctx.fillText(d.trail[j], i * FS, cy);
      }
    });
  }

  resize();
  window.addEventListener('resize', resize);
  if (!noAnim) requestAnimationFrame(draw);
})();

// ── Boot sequence ────────────────────────────────────────────

async function boot() {
  state    = 'booting';
  skipBoot = false;
  innerWin.style.opacity = '0';
  postCtx.style.opacity  = '0';
  term.innerHTML         = '';
  hintEl.textContent     = 'click anywhere to skip';
  sshType.textContent    = '';

  if (noAnim) { revealMenu(); return; }

  await wait(400);

  const cmd = 'ssh leo@gomezcollective.com';
  for (let i = 0; i < cmd.length; i++) {
    if (skipBoot) { revealMenu(); return; }
    sshType.textContent = cmd.slice(0, i + 1);
    await wait(36 + Math.random() * 20);
  }

  await wait(500);
  if (skipBoot) { revealMenu(); return; }

  innerWin.style.opacity = '1';

  term.innerHTML = L('dim', 'Connecting to gomezcollective.com…');
  await wait(650);
  if (skipBoot) { revealMenu(); return; }

  term.innerHTML += L('dim', 'Authenticating…');
  await wait(400);
  if (skipBoot) { revealMenu(); return; }

  term.innerHTML += L('accent', 'Connected. Welcome.');
  await wait(900);
  if (skipBoot) { revealMenu(); return; }

  showMenu();
}

termBg.addEventListener('click', () => { if (state === 'booting') skipBoot = true; });

function revealMenu() {
  innerWin.style.opacity = '1';
  showMenu();
}

// ── Menu ─────────────────────────────────────────────────────

function showMenu() {
  state   = 'menu';
  menuIdx = 0;
  hintEl.textContent = '↑/↓ j/k navigate  •  enter / → open';

  term.innerHTML = [
    Lg(),
    L('dim',    'Connected to gomezcollective.com'),
    div(),
    Lg(),
    `<span class="L bright">${DATA.meta.name}</span>`,
    `<span class="L soft">${DATA.meta.title}</span>`,
    `<span class="L dim">${DATA.meta.tagline}</span>`,
    Lg(),
    '<div class="mlist" id="mlist"></div>',
    Lg(),
  ].join('');

  renderMenu();
  term.scrollTop = 0;
  postCtx.style.opacity = '1';
}

function renderMenu() {
  const list = document.getElementById('mlist');
  if (!list) return;
  list.innerHTML = SECTS.map((s, i) => {
    const sel = i === menuIdx;
    return `<div class="mitem${sel ? ' sel' : ''}" data-i="${i}">
      <span class="mcaret">${sel ? '›' : ' '}</span>
      <span class="mlabel">${s}</span>
    </div>`;
  }).join('');

  list.querySelectorAll('.mitem').forEach(el => {
    el.addEventListener('click', () => { menuIdx = +el.dataset.i; openSection(); });
  });
}

function updateMenu() {
  document.querySelectorAll('.mitem').forEach((el, i) => {
    const sel = i === menuIdx;
    el.classList.toggle('sel', sel);
    el.querySelector('.mcaret').textContent = sel ? '›' : ' ';
    if (sel) el.scrollIntoView({ block: 'nearest' });
  });
}

// ── Sections ─────────────────────────────────────────────────

async function openSection() {
  state = 'section';
  hintEl.textContent = '← h b esc/q  back  •  ↑/↓ scroll';

  const lines = buildSection(SECTS[menuIdx]);
  const closer = [
    Lg(),
    div(),
    `<span class="L"><span class="pmt">$ </span><button class="back-btn" id="back-btn">‹ back to menu</button><span class="cursor"> █</span></span>`,
  ];

  if (noAnim) {
    term.innerHTML = lines.join('') + closer.join('');
    document.getElementById('back-btn')?.addEventListener('click', showMenu);
    term.scrollTop = 0;
    return;
  }

  term.innerHTML = '';
  term.scrollTop = 0;

  for (const l of lines) {
    if (state !== 'section') return;
    term.innerHTML += l;
    term.scrollTop = term.scrollHeight;
    await wait(16);
  }

  term.innerHTML += closer.join('');
  document.getElementById('back-btn')?.addEventListener('click', showMenu);
}

// ── Section builders ─────────────────────────────────────────

function buildSection(name) {
  const map = {
    'Pre-seed Experience': buildExp,
    'Key Projects':        buildKeyProj,
    'Passion Projects':    buildPassion,
    'Skills':              buildSkills,
    'Impact & Outcomes':   buildImpact,
    'Contact & Links':     buildContact,
  };
  return (map[name] || (() => [L('dim', 'Not found.')]))();
}

function buildExp() {
  const ls = sectHd('PRE-SEED EXPERIENCE');
  DATA.experience.forEach(e => {
    ls.push(L('', `<span class="bright">${e.company}</span>  <span class="dim">${e.period}</span>`));
    ls.push(L('dim', `${e.role}`));
    e.bullets.forEach(b => ls.push(L('', `  · ${b}`)));
    ls.push(Lg());
  });
  return ls;
}

function buildKeyProj() {
  const ls = sectHd('KEY PROJECTS');
  DATA.keyProjects.forEach((p, i) => {
    ls.push(L('', `<span class="accent">[${String(i+1).padStart(2,'0')}]</span>  <span class="bright">${p.name}</span>`));
    ls.push(L('dim', `       ${p.tags.join(' · ')}`));
    ls.push(L('', `       ${p.desc}`));
    ls.push(Lg());
  });
  return ls;
}

function buildPassion() {
  const ls = sectHd('PASSION PROJECTS');
  DATA.passionProjects.forEach((p, i) => {
    ls.push(L('', `<span class="accent">[${String(i+1).padStart(2,'0')}]</span>  <span class="bright">${p.name}</span>`));
    ls.push(L('dim', `       ${p.tags.join(' · ')}`));
    ls.push(L('', `       ${p.desc}`));
    if (p.url) ls.push(L('', `       <a class="ac-link" href="${p.url}" target="_blank" rel="noopener">${p.url.replace('https://','')}</a>`));
    ls.push(Lg());
  });
  return ls;
}

function buildSkills() {
  const ls = sectHd('SKILLS');
  Object.entries(DATA.skills).forEach(([cat, items]) => {
    ls.push(L('bright', cat));
    items.forEach(item => ls.push(L('', `  – ${item}`)));
    ls.push(Lg());
  });
  return ls;
}

function buildImpact() {
  const ls = sectHd('IMPACT & OUTCOMES');
  DATA.impact.forEach(r =>
    ls.push(L('', `  <span class="accent" style="display:inline-block;min-width:120px">${r.metric}</span><span class="dim">${r.context}</span>`))
  );
  ls.push(Lg());
  return ls;
}

function buildContact() {
  const ls = sectHd('CONTACT & LINKS');
  const c  = DATA.contact;
  const row = (label, val, href) =>
    L('', `  <span class="dim" style="display:inline-block;min-width:84px">${label}</span>` +
      `<a class="ac-link" href="${href}" target="${href.startsWith('mailto') ? '_self' : '_blank'}" rel="noopener">${val}</a>`);
  ls.push(row('Portfolio',    c.site.replace('https://',''),    c.site));
  ls.push(row('Email',        c.email,                          `mailto:${c.email}`));
  ls.push(row('Live product', c.product.replace('https://',''), c.product));
  ls.push(row('LinkedIn',     c.linkedin.replace('https://',''),c.linkedin));
  ls.push(Lg());
  ls.push(L('dim', c.cta));
  ls.push(Lg());
  return ls;
}

// ── Keyboard ─────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  if (state === 'menu') {
    if (e.key === 'ArrowUp' || e.key === 'k') {
      e.preventDefault();
      menuIdx = (menuIdx - 1 + SECTS.length) % SECTS.length;
      updateMenu();
    } else if (e.key === 'ArrowDown' || e.key === 'j') {
      e.preventDefault();
      menuIdx = (menuIdx + 1) % SECTS.length;
      updateMenu();
    } else if (e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'l') {
      e.preventDefault();
      openSection();
    }
  } else if (state === 'section') {
    if (e.key === 'Escape' || e.key === 'q' || e.key === 'b' || e.key === 'ArrowLeft' || e.key === 'h') {
      e.preventDefault();
      showMenu();
    }
  }
});

// ── Reconnect ────────────────────────────────────────────────

document.getElementById('reconnect-btn').addEventListener('click', () => {
  sshType.textContent = '';
  boot();
});

// ── Init ─────────────────────────────────────────────────────
boot();
</script>
