  <style>
    /* ── Homepage Terminal Hero ─────────────────────────── */
    :root {
      --ht-accent:      #4077ed;
      --ht-ink:         rgba(255,255,255,0.85);
      --ht-soft:        rgba(255,255,255,0.65);
      --ht-faint:       rgba(255,255,255,0.52);
      --ht-line:        rgba(255,255,255,0.14);
      --ht-mono:        'JetBrains Mono','Source Code Pro',monospace;
    }

    section.hero {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 0;
      background: #b8ccd8 url('assets/08_SSH/BG-Only.jpg') center/cover no-repeat;
    }

    /* Terminal overlay — always above scrolling cards */
    .terminal-chrome {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 28px 52px;
      overflow: hidden;
    }
    .hterm-outer    { pointer-events: auto; }
    .hero-top-right { pointer-events: auto; }

    /* Icons: top-right corner — aligned to subnav tab baseline */
    .hero-top-right {
      position: absolute;
      top: 46px;
      right: 28px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 22px;
    }
    .theme-toggle { display: none !important; }
    .hero-top-right .social-icon img {
      width: 18px; height: 18px;
      filter: brightness(0) opacity(0.60);
      transition: filter .2s;
    }
    .hero-top-right .social-icon:hover img { filter: brightness(0) opacity(0.92); }

    /* Ensure 44px tap targets on mobile */
    @media (max-width: 768px) {
      .hero-top-right .social-icon {
        padding: 13px;
        margin: -13px 0;
      }
      .hero-top-right { gap: 4px; right: 16px; top: 28px; }
    }

    /* G Lottie — floats in front of terminal (transparent bg so terminal content shows through) */
    #g-lottie {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
      opacity: 0.07;
      will-change: transform;
    }

    /* Push work content below the fixed hero */
    .work-section {
      position: relative;
      z-index: 1;
      background: transparent;
      margin-top: calc(100dvh - 40px);
      padding-bottom: 80px;
    }

    @media (max-width: 768px) {
      .work-section { margin-top: calc(100dvh - 20px); }
    }

    /* Transparent containers — sky shows through */
    .work-tabs-row {
      background: transparent;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
      top: 20px; /* aligns with minimized terminal (MARGIN=20px) on scroll */
    }

    /* Darker text over the light sky background */
    .work-tab              { color: rgba(30,25,25,0.60); }
    .work-tab.active,
    .work-tab:hover        { color: rgba(30,25,25,0.92); }
    .company-bio           { font-size: 14px; }
    .view-more,
    .company-card .access-label { color: rgba(30,25,25,0.62); }

    .company-card {
      background: transparent;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
      border: none;
      box-shadow: none;
      border-radius: 0;
    }

    /* Terminal above G lottie */
    .hterm-outer {
      position: relative;
      z-index: 2;
      will-change: transform;
    }

    /* macOS outer window */
    .hterm-outer {
      width: clamp(500px, 70vw, 860px);
      max-width: 100%;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(22,22,24,0.90);
      border: 1px solid rgba(0,0,0,0.5);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.07), 0 32px 90px rgba(30,50,80,0.50);
    }

    /* Title bar */
    .hterm-bar {
      background: linear-gradient(180deg,#3c3c3e 0%,#2c2c2e 100%);
      border-bottom: 1px solid #111;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      user-select: none;
    }
    .hterm-dots { display:flex; gap:8px; flex-shrink:0; }
    .hterm-dot  { width:12px; height:12px; border-radius:50%; }
    .hterm-r    { background:#ff5f57; }
    .hterm-y    { background:#ffbd2e; }
    .hterm-g    { background:#28c840; }
    .hterm-label {
      flex:1; text-align:center;
      font-family: var(--ht-mono); font-size:12px;
      color:#888; letter-spacing:.04em;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }


    /* Terminal body */
    .hterm-body {
      position:relative;
      height:589px;
      padding:16px 0 0;
      display:flex; flex-direction:column; align-items:flex-start; gap:10px;
      background:rgba(140,165,190,.08);
      overflow:hidden;
    }
    #hterm-canvas { position:absolute; inset:0; z-index:0; pointer-events:none; }

    /* Shell context lines */
    .hterm-shell-pre, .hterm-shell-post {
      align-self:flex-start; position:relative; z-index:1;
      padding-left:18px;
      font-family:var(--ht-mono); font-size:12px;
      color:rgba(255,255,255,.35); line-height:1.6;
    }
    .hterm-pmt { color:rgba(255,255,255,.25); }
    .hterm-cur {
      display:inline-block; width:7px; height:13px;
      background:rgba(255,255,255,.45); vertical-align:text-bottom;
      animation:ht-blink 1s step-end infinite;
    }
    @keyframes ht-blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @media (prefers-reduced-motion:reduce) { .hterm-cur { animation:none; } }

    /* Terminal scrollable content */
    .hterm-term {
      position:relative; z-index:2;
      width:100%;
      flex:1;
      padding:20px 24px 24px 18px;
      overflow-y:auto;
      font-family:var(--ht-mono); font-size:13px;
      color:var(--ht-ink); line-height:1.72;
      box-sizing:border-box;
    }
    .hterm-term::-webkit-scrollbar { width:3px; }
    .hterm-term::-webkit-scrollbar-track { background:transparent; }
    .hterm-term::-webkit-scrollbar-thumb { background:var(--ht-line); border-radius:2px; }

    .hterm-term-footer {
      position:relative; z-index:2;
      width:100%;
      flex-shrink:0;
      border-top:1px solid var(--ht-line);
      background:rgba(255,255,255,.04);
      padding:7px 24px 7px 18px;
      box-sizing:border-box;
    }
    .hterm-hint { font-family:var(--ht-mono); font-size:11px; color:var(--ht-faint); letter-spacing:.04em; }

    /* Terminal line helpers */
    .htL  { display:block; white-space:pre-wrap; word-break:break-word; }
    .htLg { display:block; height:calc(13px * 1.72); }
    .ht-dim    { color:var(--ht-faint); }
    .ht-bright { color:var(--ht-ink); font-weight:600; }
    .ht-accent { color:var(--ht-accent); }
    .ht-soft   { color:var(--ht-soft); }
    .ht-name   { font-family:'Sorts Mill Goudy',Georgia,serif; font-size:24px; letter-spacing:0.12em; color:var(--ht-ink); }
    .ht-name em { font-style:italic; }

    /* Menu */
    .ht-mlist { margin:4px 0; }
    .ht-mitem {
      display:flex; align-items:center; gap:10px;
      padding:5px 10px;
      border-left:2px solid transparent;
      cursor:pointer;
      transition:background .1s, border-color .1s;
      border-radius:0 5px 5px 0;
    }
    .ht-mitem:hover { background:rgba(255,255,255,.07); }
    .ht-mitem.sel  { background:rgba(64,119,237,.10); border-left-color:var(--ht-accent); }
    .ht-mcaret { color:var(--ht-accent); width:12px; flex-shrink:0; font-weight:700; }
    .ht-mlabel { color:rgba(255,255,255,0.50); font-size:14px; }
    .ht-mitem.sel .ht-mlabel { color:#fff; font-weight:600; }

    /* Use-case description lines: 2px smaller */
    .ht-desc { font-size:11px; color:var(--ht-faint); }

    .ht-ac-link { color:var(--ht-accent); text-decoration:none; }
    .ht-ac-link:hover { color:rgba(255,255,255,.85); text-decoration:underline; }

    .ht-back-btn {
      background:none; border:none;
      font-family:var(--ht-mono); font-size:13px;
      cursor:pointer; color:var(--ht-accent); padding:0;
    }
    .ht-back-btn:hover { color:rgba(255,255,255,.85); }

    .ht-cursor {
      display:inline-block; color:var(--ht-accent);
      animation:ht-cursor-blink 1.1s step-end infinite;
    }
    @keyframes ht-cursor-blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @media (prefers-reduced-motion:reduce) { .ht-cursor { animation:none; } }

    /* Hamburger — desktop: hidden */
    .nav-hamburger { display: none; }

    /* G home button — mobile only */
    .g-nav-home { display: none; }

    /* Mobile — terminal leaves fixed layer, flows with page */
    @media (max-width:680px) {
      /* G home link: top-left, same vertical band as hamburger */
      .g-nav-home {
        display: flex;
        position: fixed;
        top: 16px;
        left: 16px;
        width: 44px;
        height: 44px;
        align-items: center;
        justify-content: center;
        font-family: 'Sorts Mill Goudy', Georgia, serif;
        font-size: 28px;
        font-weight: 400;
        color: rgba(30,25,25,0.80);
        text-decoration: none;
        z-index: 100;
        pointer-events: auto;
        -webkit-tap-highlight-color: transparent;
      }
      /* Align tabs with hamburger center (top:16px + height:44px → center at 38px) */
      .work-tabs-row {
        top: 0;
        padding: 28px 16px 10px;
      }

      /* Take terminal out of the fixed overlay so cards scroll independently */
      .terminal-chrome {
        position: relative;
        inset: auto;
        padding: 28dvh 0 0;
        align-items: flex-end;
        pointer-events: none;
        overflow: visible;
      }
      /* G: visible and in front, fills terminal-chrome area */
      #g-lottie { position: absolute; inset: 0; }

      /* Icon nav: fixed top-right, only shows hamburger by default */
      .hero-top-right {
        position: fixed;
        top: 16px;
        right: 16px;
        gap: 0;
        align-items: center;
      }
      /* Hide individual icons on mobile, show hamburger */
      .hero-top-right .nav-icon { display: none; }
      .nav-hamburger {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
        width: 44px;
        height: 44px;
        padding: 10px;
        background: none;
        border: none;
        cursor: pointer;
        pointer-events: auto;
      }
      .nav-hamburger span {
        display: block;
        width: 20px;
        height: 2px;
        background: rgba(30,25,25,0.70);
        border-radius: 2px;
        transition: transform .2s, opacity .2s;
      }
      /* Open state — X */
      .nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
      .nav-hamburger.open span:nth-child(2) { opacity: 0; }
      .nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
      /* Dropdown panel */
      .hero-top-right.menu-open .nav-icon {
        display: flex;
        position: fixed;
        right: 16px;
        flex-direction: column;
        background: rgba(255,255,255,0.92);
        border-radius: 10px;
        padding: 8px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        pointer-events: auto;
      }
      .hero-top-right.menu-open .nav-icon:nth-child(1) { top: 68px; }
      .hero-top-right.menu-open .nav-icon:nth-child(2) { top: 116px; }
      .hero-top-right.menu-open .nav-icon:nth-child(3) { top: 164px; }
      .hero-top-right .nav-icon img {
        width: 22px; height: 22px;
        filter: brightness(0) opacity(0.65);
      }

      /* Terminal outer: full-width strip */
      .hterm-outer {
        width: 100%;
        max-width: 100%;
        border-radius: 0;
        pointer-events: auto;

      'TV':               ['Roku', 'Disney+', 'Spotify'],

      'Web':              ['AminoChain', 'Symmetry', 'Spin or Flip', 'Roku']
    };

    function filterCards(platformLabel) {
      var names = PLATFORM_CARDS[platformLabel] || [];
      document.querySelectorAll('company-card').forEach(function (card) {
        var cardName = card.getAttribute('name') || '';
        var match = names.some(function (n) { return cardName.toLowerCase().includes(n.toLowerCase()); });
        card.style.display = match ? '' : 'none';
      });
      var workSection = document.querySelector('.work-section');
      if (workSection) {
        setTimeout(function () {
          workSection.scrollIntoView({ behavior: 'smooth' });
        }, 120);
      }
    }

    function clearFilter() {
      document.querySelectorAll('company-card').forEach(function (card) {
        card.style.display = '';
      });
    }

    var term    = document.getElementById('hterm-term');
    var hintEl  = document.getElementById('hterm-hint');
    var noAnim  = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var htState = 'menu';
    var htIdx   = 0;

    function L(cls, html) { return '<span class="htL ' + cls + '">' + html + '</span>'; }
    function Lg() { return '<span class="htLg"></span>'; }

    /* ── Menu ── */
    function showMenu() {
      htState = 'menu';
      clearFilter();
      hintEl.textContent = '↑/↓   j/k   navigate ·   enter/→   open';
      term.innerHTML = [
        L('', '<span class="ht-name"><em>L</em>eo Gomez Blum</span>'),
        Lg(),
        L('ht-soft', 'Founding product designer and design engineer.'),
        Lg(),
        L('ht-dim', 'Taking complex products from zero to first customers while owning brand,'),
        L('ht-dim', 'product, and design systems. AI-native, using Claude Code and agents to'),
        L('ht-dim', 'go from concept to shipped product.'),
        Lg(),
        L('ht-dim', 'Looking for teams building generative UI and conversational products,'),
        L('ht-dim', 'especially ones that keep tech human.'),
        Lg(),
        div(),
        Lg(),
        L('ht-dim', 'Select a platform:'),
        Lg(),
        '<div class="ht-mlist" id="ht-mlist"></div>',
        Lg(),
      ].join('');
      renderMenu();
      term.scrollTop = 0;
    }

    function renderMenu() {
      var list = document.getElementById('ht-mlist');
      if (!list) return;
      list.innerHTML = PLATFORMS.map(function (p, i) {
        var sel = i === htIdx;
        return '<div class="ht-mitem' + (sel ? ' sel' : '') + '" data-i="' + i + '">'
          + '<span class="ht-mcaret">' + (sel ? '›' : ' ') + '</span>'
          + '<span class="ht-mlabel">' + p.label + (sel ? '<span class="ht-cursor"> █</span>' : '') + '</span>'
          + '</div>';
      }).join('');
      list.querySelectorAll('.ht-mitem').forEach(function (el) {
        el.addEventListener('click', function () { htIdx = +el.dataset.i; openSection(); });
      });
    }

    function updateMenu() {
      document.querySelectorAll('.ht-mitem').forEach(function (el, i) {
        var sel = i === htIdx;
        el.classList.toggle('sel', sel);
        el.querySelector('.ht-mcaret').textContent = sel ? '›' : ' ';
        var labelEl = el.querySelector('.ht-mlabel');
        var cursorEl = labelEl.querySelector('.ht-cursor');
        if (sel && !cursorEl) {
          labelEl.insertAdjacentHTML('beforeend', '<span class="ht-cursor"> █</span>');
        } else if (!sel && cursorEl) {
          cursorEl.remove();
        }
        if (sel) el.scrollIntoView({ block: 'nearest' });
      });
    }

    /* ── Section ── */
    function openSection() {
      htState = 'section';
      hintEl.textContent = '← / esc   back to platforms';
      var p = PLATFORMS[htIdx];
      filterCards(PLATFORMS[htIdx].label);
      var lines = [
        Lg(),
        div(),
        L('ht-bright', p.label.toUpperCase()),
        div(),

        var num = i < 9 ? '0' + (i + 1) : '' + (i + 1);

      lines.push(Lg());
      lines.push(div());
      lines.push(L('', '<span class="ht-accent">$ </span><button class="ht-back-btn" id="ht-back">&#8249; back to platforms</button><span class="ht-cursor"> █</span>'));
      term.innerHTML = lines.join('');

          htIdx = (htIdx - 1 + PLATFORMS.length) % PLATFORMS.length;

        } else if (e.key === 'ArrowDown' || e.key === 'j') {
          e.preventDefault();
          htIdx = (htIdx + 1) % PLATFORMS.length;
          updateMenu();
        } else if (e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'l') {
          e.preventDefault();
          openSection();
        }
      } else if (htState === 'section') {
        if (e.key === 'Escape' || e.key === 'q' || e.key === 'b' || e.key === 'ArrowLeft' || e.key === 'h') {
          e.preventDefault();
          showMenu();

      }

    /* ── Character rain ── */
    (function () {
      var canvas  = document.getElementById('hterm-canvas');
      var ctx     = canvas.getContext('2d');
      var body    = document.getElementById('hterm-body');
      var CHARS   = 'GOMEZCOLLECTIVE0123456789!@#$?/\\|<>abcdefghijklmnopqrstuvwxyz';
      var FS      = 13;
      var cols, drops;

      function resize() {
        var r = body.getBoundingClientRect();
        canvas.width  = r.width;
        canvas.height = r.height;
        cols  = Math.floor(canvas.width / FS);
        drops = Array.from({ length: cols }, function () {
          return {
            y:     Math.random() * -80,
            speed: 0.12 + Math.random() * 0.28,
            trail: Array.from({ length: 14 }, function () { return CHARS[Math.floor(Math.random() * CHARS.length)]; }),
            tick:  0,
          };
        });
      }

      var last = 0;
      function draw(ts) {
        if (!noAnim) requestAnimationFrame(draw);
        var dt = Math.min(ts - last, 50);
        last = ts;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = FS + 'px "JetBrains Mono",monospace';
        drops.forEach(function (d, i) {
          d.y    += d.speed * (dt / 16);
          d.tick += dt;
          if (d.y * FS > canvas.height + 60) { d.y = -Math.random() * 40; d.speed = 0.12 + Math.random() * 0.28; }
          if (d.tick > 130 + Math.random() * 200) { d.trail[Math.floor(Math.random() * d.trail.length)] = CHARS[Math.floor(Math.random() * CHARS.length)]; d.tick = 0; }
          for (var j = 0; j < d.trail.length; j++) {
            var cy = (d.y - j) * FS;
            if (cy < -FS || cy > canvas.height) continue;
            var alpha = Math.max(0, (d.trail.length - j) / d.trail.length) * 0.07;
            ctx.fillStyle = 'rgba(58,67,100,' + alpha.toFixed(3) + ')';
            ctx.fillText(d.trail[j], i * FS, cy);
          }
        });
      }

      resize();
      window.addEventListener('resize', resize);
      if (!noAnim) requestAnimationFrame(draw);
    })();

    /* Init */
    showMenu();

  })();

    var termScroll = document.getElementById('hterm-term');
    if (!outer) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var MIN_S      = 0.10;
    var MARGIN     = 20;

    var cache = {};
    function measure() {
      cache.tw = outer.offsetWidth;
      cache.th = outer.offsetHeight;
      cache.vw = window.innerWidth;
      cache.vh = window.innerHeight;

      /* Terminal end position — top-left corner */
      cache.endCx = MARGIN + cache.tw * MIN_S / 2;
      cache.endCy = MARGIN + cache.th * MIN_S / 2;
    }

    function update() {
      /* On mobile the terminal is full-width at bottom — skip transform */
      if (cache.vw <= 680) {
        outer.style.transform = '';
        if (gEl) { gEl.style.transform = ""; gEl.style.opacity = "0.07"; }
        if (termScroll) termScroll.style.overflowY = 'auto';
        return;
      }

      var scrollProg = Math.min(1, Math.max(0, window.scrollY / (cache.vh * 0.90)));
      var prog = scrollProg < 0.5
        ? 2 * scrollProg * scrollProg
        : 1 - Math.pow(-2 * scrollProg + 2, 2) / 2;

      /* Disable terminal internal scroll while page is scrolling */
      if (termScroll) termScroll.style.overflowY = scrollProg > 0 ? 'hidden' : 'auto';

      /* Terminal */
      var s  = 1 - prog * (1 - MIN_S);
      var tx = prog * (cache.endCx - cache.vw / 2);
      var ty = prog * (cache.endCy - cache.vh / 2);
      outer.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';

      /* G Lottie — syncs exactly with terminal so it never drifts past it */
      if (gEl) {
        gEl.style.transform = outer.style.transform;
        gEl.style.transformOrigin = '50% 50%';
        gEl.style.opacity = (0.07 + prog * 0.93).toFixed(3);
      }

    }

    var raf;
    window.addEventListener('scroll', function () {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(update);
    }, { passive: true });

    window.addEventListener('resize', function () { measure(); update(); });

    measure();
    update();
  })();
  </script>

  <script>
  /* Hamburger menu — mobile only */
  (function () {
    var btn = document.querySelector('.nav-hamburger');
    var nav = document.querySelector('.hero-top-right');
    if (!btn || !nav) return;
    btn.addEventListener('click', function () {
      var open = nav.classList.toggle('menu-open');
      btn.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    // Close when clicking a link
    nav.querySelectorAll('.nav-icon').forEach(function (a) {
      a.addEventListener('click', function () {
        nav.classList.remove('menu-open');
        btn.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      });
    });
  })();
  </script>
</body>
</html>
